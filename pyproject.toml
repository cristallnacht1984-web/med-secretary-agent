[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "med-secretary"
version = "0.1.0"
description = "MedNews Secretary Agent — асинхронный Telegram-бот: ежедневный аналитический дайджест медицинских новостей + личный секретарь-календарь"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0",
    "openai>=1.0",
    "google-api-python-client",
    "apscheduler>=3.10",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "pydantic-settings>=2.0",
    "structlog",
    "aiohttp",
    "feedparser",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
